name: 发布 frpc Web 控制台

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: 构建 Vue 静态资源
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: 运行 Go 测试
        run: go test ./...

      - name: 交叉编译 Linux 二进制
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/frpc-web-linux-amd64 ./cmd/frpc-web
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/frpc-web-linux-arm64 ./cmd/frpc-web
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o dist/frpc-web-linux-arm ./cmd/frpc-web
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -trimpath -ldflags="-s -w" -o dist/frpc-web-linux-386 ./cmd/frpc-web
          cd dist
          sha256sum frpc-web-linux-* > SHA256SUMS

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
          fi
